name: GAX100 – offline preview with fictional results
on:
  push:
    branches: [codex/gax100-satila-blueprint-2026-11-09]
    paths:
      - scripts/build_offline_preview.py
      - tests/test_offline_preview_browser.py
      - .github/workflows/gax-offline-preview.yml
      - docs/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout public code only – NO private participant database
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate completely offline single-file HTML with SYNTHETIC data
        run: python3 -B scripts/build_offline_preview.py --docs docs --out preview/GAX100-FORHANDSGRANSKNING.html
      - name: Install Chromium for actual local file browser test
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Verify the user can open HTML by double clicking – without server
        run: python3 -B tests/test_offline_preview_browser.py --file preview/GAX100-FORHANDSGRANSKNING.html
      - name: Upload reviewed HTML (fictional runner data ONLY)
        uses: actions/upload-artifact@v4
        with:
          name: GAX100-FORHANDSGRANSKNING-FIKTIVA-DATA
          path: preview/GAX100-FORHANDSGRANSKNING.html
          if-no-files-found: error
          retention-days: 7
# Never fetch private repos or upload real GAX participant data.
# No GitHub Pages publish; no site release; no server needed on the user's computer.
