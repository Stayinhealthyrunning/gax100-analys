name: GAX100 private-style review – synthetic offline artifact (NO Pages)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-synthetic-review:
    if: ${{ github.actor == 'Stayinhealthyrunning' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout GAX blueprint – public frontend ONLY
        uses: actions/checkout@v4
        with:
          ref: codex/gax100-satila-blueprint-2026-11-09
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate empty public result bundles and blueprint
        run: python3 -B -m unittest discover -s tests -p 'test_blueprint_contract.py' -v
      - name: Generate one HTML file with fictional runners
        run: python3 -B scripts/build_offline_preview.py --docs docs --out preview/GAX100-FORHANDSGRANSKNING.html
      - name: Install browser test environment
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Test synthetic-only offline file at 390 and 1440 px
        run: python3 -B tests/test_offline_preview_browser.py --file preview/GAX100-FORHANDSGRANSKNING.html
      - name: Verify artifact contains no raw data, CNAME or extra file
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('preview/GAX100-FORHANDSGRANSKNING.html')
          assert list(Path('preview').iterdir())==[p], 'Unexpected preview assets'
          s=p.read_text(encoding='utf-8')
          for marker in ('Demolöpare ', 'ALL NAMES AND TIMES ARE FABRICATED',
                         'PRIVATE_DATA_WITHHELD', 'FÖRHANDSGRANSKNING',
                         '<meta name="robots" content="noindex, nofollow">'):
              assert marker in s, 'Required synthetic-only privacy marker missing'
          for marker in ('gax100.sqlite', 'LOPPANALYS_PRIVACY_REGISTRY_B64', '<script src="assets/',
                         '<link rel="stylesheet" href="assets/'):
              assert marker not in s, 'Unsafe external or private dependency'
          print('GAX_ARTIFACT_ONLY_PASS: no Pages, no real participant records')
          PY
      - name: Save HTML for offline design review only
        uses: actions/upload-artifact@v4
        with:
          name: gax100-synthetic-offline-design-${{ github.run_id }}
          path: preview/GAX100-FORHANDSGRANSKNING.html
          retention-days: 14
          if-no-files-found: error

# No pages:write, id-token:write or actions/deploy-pages.
# The HTML is synthetic and publicly downloadable as an artifact in this public repo.
# Real GAX results remain private until independent GDPR, rights and QA approval.
