name: GAX100 Snapshot UX QA (not a release gate)

on:
  pull_request:
    branches: [main, codex/gax100-etapp2, audit/gax100-plan-precision-2026-10-12]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Assert frozen published snapshot is complete
        run: |
          node -e "const p=require('./web/data.json'); const c=require('./scripts/verify_source_integrity'); const errs=c.checkPublicPayload(p); if(errs.length) { console.error(errs); process.exit(1) } console.log('Verified snapshot 14 editions / 945 results / 1838 observations')"
      - name: Test calculations, privacy, public modules and GPX fixture parsers
        run: |
          npm run test:statistics
          node tests/test_source_integrity.js
          npm run test:plan
          node tests/test_comparison.js
          npm run test:field
          npm run test:time-parser
          npm run test:time-format
          npm run test:gpx-parser
          npm run test:gpx-geometry
          npm run test:gpx-preview
          npm run test:privacy
          npm run test:web
      - name: Test active UX and responsive screenshots on frozen source snapshot
        run: npm run test:browser
      - name: Upload screenshot and interaction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gax100-snapshot-ui-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
